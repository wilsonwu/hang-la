<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: file:; connect-src 'self';"
    />
    <title>夯到拉排序器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="board" id="board"></main>
    </div>

    <dialog class="editor-dialog" id="editorDialog">
      <form class="editor-form" id="editorForm" method="dialog">
        <div class="editor-header">
          <div>
            <p class="eyebrow">内容编辑器</p>
            <h2 id="dialogTitle">新增排序项</h2>
          </div>
          <button type="button" class="ghost-button" id="closeDialogButton">关闭</button>
        </div>

        <label class="field-group">
          <span>名称</span>
          <input id="itemTitleInput" name="title" maxlength="24" placeholder="例如：XX 品牌" required />
        </label>

        <label class="field-group">
          <span>文字图标</span>
          <input id="itemBadgeInput" name="badge" maxlength="6" placeholder="例如：潮、神、A1" />
        </label>

        <div class="field-group">
          <span>图片图标</span>
          <div class="image-picker-row">
            <button type="button" class="primary-button" id="pickImageButton">选择图片</button>
            <button type="button" class="ghost-button" id="clearImageButton">清空图片</button>
          </div>
          <div class="image-preview" id="imagePreview">
            <span class="placeholder-text">未选择图片</span>
          </div>
        </div>

        <label class="field-group">
          <span>备注</span>
          <textarea id="itemNoteInput" name="note" maxlength="80" placeholder="可选：写一点辨识信息"></textarea>
        </label>

        <div class="editor-actions">
          <button type="button" class="ghost-button" id="cancelDialogButton">取消</button>
          <button type="submit" class="primary-button">保存</button>
        </div>
      </form>
    </dialog>

    <template id="laneTemplate">
      <section class="lane">
        <div class="lane-header">
          <p class="lane-tag"></p>
          <h2 class="lane-title"></h2>
          <div class="lane-tools"></div>
        </div>
        <div class="lane-dropzone"></div>
      </section>
    </template>

    <template id="itemTemplate">
      <article class="rank-item" draggable="true">
        <button class="item-action item-delete" type="button" title="删除">删</button>
        <div class="item-visual"></div>
        <div class="item-content">
          <strong class="item-title"></strong>
          <p class="item-note"></p>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
